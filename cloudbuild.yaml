options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud beta run deploy comprovai \
          --quiet \
          --source=. \
          --function=run \
          --region=southamerica-east1 \
          --service-account=receipt-payment-organizer@$PROJECT_ID.iam.gserviceaccount.com \
          --no-allow-unauthenticated \
          --set-env-vars=OPENAI_API_KEY=$$OPENAI_API_KEY,GCS_BUCKET_NAME=$$GCS_BUCKET_NAME,DRIVE_FOLDER_ID=$$DRIVE_FOLDER_ID \
          --memory=512Mi \
          --timeout=300s
    secretEnv:
      - OPENAI_API_KEY
      - GCS_BUCKET_NAME
      - DRIVE_FOLDER_ID

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_API_KEY/versions/latest
      env: OPENAI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/GCS_BUCKET_NAME/versions/latest
      env: GCS_BUCKET_NAME
    - versionName: projects/$PROJECT_ID/secrets/DRIVE_FOLDER_ID/versions/latest
      env: DRIVE_FOLDER_ID